name: Verify and release standalone engineering apps
on:
  push:
    paths:
      - '.github/workflows/standalone-lab.yml'
      - 'src/lab/**'
      - 'src/data/**'
      - 'src/engineering.css'
      - 'packages/**'
      - 'tools/**'
      - 'docs/projects/**'
      - 'docs/artwork/**'
      - 'public/lab-screenshots/**'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/standalone-lab.yml'
      - 'src/lab/**'
      - 'src/data/**'
      - 'src/engineering.css'
      - 'packages/**'
      - 'tools/**'
      - 'docs/projects/**'
      - 'docs/artwork/**'
      - 'public/lab-screenshots/**'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:standalone
      - uses: actions/upload-artifact@v6
        with:
          name: standalone-lab-release
          path: test-output/standalone/release/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'Paragjindal01/paragjindal-portfolio'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: portfolio-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v6
        with:
          name: standalone-lab-release
          path: ${{ runner.temp }}/standalone-lab-release
      - name: Publish verified version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_DIR: ${{ runner.temp }}/standalone-lab-release
        run: node tools/publish-release.mjs standalone "$ASSET_DIR"
