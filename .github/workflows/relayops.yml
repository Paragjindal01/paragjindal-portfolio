name: Verify RelayOps AI
on:
  push:
    paths: ['relayops-ai/**', '.github/workflows/relayops.yml', 'tools/publish-release*.mjs']
  pull_request:
    paths: ['relayops-ai/**', '.github/workflows/relayops.yml', 'tools/publish-release*.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relayops-ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relayops-ai/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:service

      - name: Test the SQLite Compose image
        run: |
          docker compose up -d --build --wait
          curl --fail --silent http://127.0.0.1:4174/relayops/ > /dev/null
          npm run benchmark
      - name: Collect Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop Compose
        if: always()
        run: docker compose down

      - name: Package verified RelayOps source
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./relayops-ai/package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="relayops-ai-v$version"
          output="$RUNNER_TEMP/relayops-release"
          mkdir -p "$output"
          git archive --format=tar.gz "$GITHUB_SHA" relayops-ai > "$output/$tag.tgz"
          (cd "$output" && sha256sum "$tag.tgz" > "$tag-SHA256SUMS")
          node -e 'process.stdout.write(JSON.stringify({tag: process.argv[1], sourceCommit: process.env.GITHUB_SHA}) + "\n")' "$tag" > "$output/verification.json"
      - uses: actions/upload-artifact@v6
        with:
          name: relayops-verified-source
          path: ${{ runner.temp }}/relayops-release/
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'Paragjindal01/paragjindal-portfolio'
    needs: workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: portfolio-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v6
        with:
          name: relayops-verified-source
          path: ${{ runner.temp }}/relayops-release
      - name: Publish verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_DIR: ${{ runner.temp }}/relayops-release
        run: node tools/publish-release.mjs relayops "$ASSET_DIR"
