name: Verify RelayOps AI
on:
  push:
    paths: ['relayops-ai/**', '.github/workflows/relayops.yml']
  pull_request:
    paths: ['relayops-ai/**', '.github/workflows/relayops.yml']
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relayops-ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relayops-ai/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:service

      - name: Test the SQLite Compose image
        run: |
          docker compose up -d --build --wait
          curl --fail --silent http://127.0.0.1:4174/relayops/ > /dev/null
          npm run benchmark
      - name: Collect Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop Compose
        if: always()
        run: docker compose down

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository == 'Paragjindal01/paragjindal-portfolio'
    needs: workflow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish verified source archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh repo view --json nameWithOwner --jq '.nameWithOwner')" = 'Paragjindal01/paragjindal-portfolio'
          version="$(node -p 'require("./relayops-ai/package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="relayops-ai-v$version"
          filename="$tag.tgz"
          if gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/relayops-existing.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/relayops-existing.json")" = false
            jq -e --arg filename "$filename" 'any(.assets[]; .name == $filename)' "$RUNNER_TEMP/relayops-existing.json" > /dev/null
            echo "$tag is already published. No release assets changed."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Refusing to reuse tag $tag without a verified release."
            exit 1
          else
            code=$?
            test "$code" -eq 2
          fi
          git archive --format=tar.gz --prefix=relayops-ai/ "$GITHUB_SHA:relayops-ai" > "$RUNNER_TEMP/$filename"
          (cd "$RUNNER_TEMP" && sha256sum "$filename" > "$tag-SHA256SUMS")
          gh release create "$tag" --target "$GITHUB_SHA" --title "RelayOps AI v$version" --latest=false \
            --notes 'Verified source release for the browser-only demo and local SQLite service. Includes workflow studio, reusable templates, signed webhooks, traces, tests, and Docker Compose.' \
            "$RUNNER_TEMP/$filename" "$RUNNER_TEMP/$tag-SHA256SUMS"
